[project]
name = "screenshot_mailinator_email"
dynamic = ["version"]
requires-python = "~=3.15.0"
dependencies = [
  "playwright==1.64.1",
  "tzdata==2026.5; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.17.2",
  "vulture==2.16",
  "ty==0.0.91",
]

[tool.uv]
required-version = "~=0.13.5"
package = false

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
select = ["ALL"]

ignore = [
  "COM812",  # Ignore due to conflict with Ruff formatter
  "ISC001",  # Ignore due to conflict with Ruff formatter
  "PLR2004", # Ignore magic value
  "D104",    # Ignore missing docstring in public package
  "D100",    # Ignore missing docstring in public module
  "T201"     # Ignore print statements
]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"**test_*.py" = ["S101", "D102", "D103", "SLF001", "PT019"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.vulture]
ignore_names = ["side_effect"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["."]
