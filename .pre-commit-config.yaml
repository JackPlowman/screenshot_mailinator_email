minimum_prek_version: "0.5.7"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f368fb366ff7f2f808dd324b83a6d32267799e19 # v0.17.2
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: 331f33fa4dfbcbca7c3da3620c137fde0faab273 # v3.9.10
    hooks:
      - id: prettier
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: "e8b4e28241a9ae8296ba6e4a491b5da4eda73283" # frozen: 3.11.1
    hooks:
      - id: editorconfig-checker
  - repo: local
    hooks:
      - id: zizmor
        name: Check GitHub Actions with zizmor
        language: python
        entry: zizmor --offline --no-progress .github
        additional_dependencies: [zizmor==1.31.1]
        pass_filenames: false
        files: ^\.github/.*\.ya?ml$
      - id: pinact
        name: Verify pinned GitHub Actions
        language: golang
        language_version: "1.27.3"
        entry: pinact run --check
        additional_dependencies:
          [github.com/suzuki-shunsuke/pinact/v5/cmd/pinact@v5.0.1]
        pass_filenames: false
        files: ^\.github/.*\.ya?ml$
      - id: just-format
        name: Check Justfile format
        language: system
        entry: just --fmt --check --unstable
        pass_filenames: false
        files: ^Justfile$
